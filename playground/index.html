<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>playground — Samet Yildiz</title>

    <link rel="stylesheet" href="../styles.css">
    <style>
      body{
        margin: 0;
        padding: 1.2rem 1.2rem 2rem;
      }
      .back{
        font-size: .9em;
        color: #6b6b78;
      }
      .back:hover{
        color: var(--accent);
        text-shadow: none;
      }
      h1{
        font-size: 2em;
        margin: .8rem 0 .2rem;
      }
      .hint{
        color: #8a8a97;
        margin: .2rem 0 0;
      }
      .stage{
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: 1.2rem auto 0;
        aspect-ratio: 1000 / 560;
        isolation: isolate;
      }
      .glow{
        position: absolute;
        inset: 0;
        background:
          radial-gradient(44% 40% at 50% 58%, rgba(167,139,250,.26), transparent 72%),
          radial-gradient(60% 30% at 50% 92%, rgba(96,165,250,.18), transparent 76%);
        filter: blur(4px);
        z-index: 0;
      }
      .floor{
        position: absolute;
        left: 14%;
        right: 14%;
        bottom: 8%;
        height: 12%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent 74%);
        filter: blur(2px);
        z-index: 1;
      }
      #dance{
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        z-index: 2;
      }
      .bubbles{
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }
      .bubbles i{
        position: absolute;
        bottom: -8%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid rgba(196,181,253,.5);
        background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.55), rgba(167,139,250,.06) 70%);
        animation: rise linear forwards;
      }
      @keyframes rise{
        from { transform: translate(0, 0) scale(.6); opacity: 0; }
        12%  { opacity: .8; }
        to   { transform: translate(var(--dx), -560px) scale(1.15); opacity: 0; }
      }
      @media (max-width: 640px){
        .stage{
          aspect-ratio: 5 / 5;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .bubbles i{ display: none; }
      }
    </style>
  </head>
  <body>
    <a class="back" href="../">&larr; sametyildiz.dev</a>
    <h1>playground</h1>
    <p class="hint">random stuff might be happening here</p>

    <!-- Rigged SpongeBob and Patrick models from rigmodels.com. SpongeBob
         plays a human dance clip retargeted onto his skeleton at load time;
         Patrick's rig has no arm bones, so he keeps the beat instead. -->
    <div class="stage" id="stage">
      <div class="glow"></div>
      <div class="floor"></div>
      <canvas id="dance" role="img" aria-label="SpongeBob SquarePants dancing in 3D"></canvas>
      <div class="bubbles" id="bubbles"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./dance.js"></script>
  </body>
</html>
